# Builds NDML on Windows and publishes it.
#
# * Push a tag `v*` (e.g. `v0.1.2`): build and create a GitHub release with the zip.
# * Run manually ("Run workflow"): build and keep the zip as a workflow artifact,
#   labelled dev-<commit>.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets
          cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
                     else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $dir = "dist/ndml"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/ndml.exe, target/release/ndml_loader.dll $dir
          Copy-Item target/release/ndmod_*.dll $dir
          Copy-Item README.md, LICENSE.txt $dir
          git archive --format=zip --prefix=ndml-source/ -o "$dir/ndml-source.zip" HEAD
          $zip = "dist/ndml-$version-windows.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndml-${{ steps.package.outputs.version }}-windows
          path: dist/ndml/

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
