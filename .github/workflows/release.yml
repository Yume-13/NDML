# Builds NDML on Windows and publishes it.
#
# * Push a tag `v*` (e.g. `v0.1.0`): build, create a GitHub release with the zip,
#   then upload the same files to itch.io with butler.
# * Run manually ("Run workflow"): build and keep the zip as a workflow artifact;
#   uploads to itch.io only if `itch` is checked.
#
# Configuration (repository settings → Secrets and variables → Actions):
# * secret `BUTLER_API_KEY`: itch.io API key (https://itch.io/user/settings/api-keys)
# * variable `ITCH_TARGET`: `<itch user>/<project>` (default below)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      itch:
        description: "Also upload to itch.io"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ITCH_TARGET: ${{ vars.ITCH_TARGET || 'catmancer0/ndml' }}
  ITCH_CHANNEL: windows

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets
          cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $dir = "dist/ndml"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/ndml.exe, target/release/ndml_loader.dll $dir
          Copy-Item target/release/ndmod_*.dll $dir
          Copy-Item README.md, LICENSE.txt $dir
          git archive --format=zip --prefix=ndml-source/ -o "$dir/ndml-source.zip" HEAD
          $zip = "dist/ndml-$version-windows.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndml-${{ steps.package.outputs.version }}-windows
          path: dist/ndml/

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true

      - name: Upload to itch.io
        if: github.ref_type == 'tag' || inputs.itch
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if (-not $env:BUTLER_API_KEY) { throw "secret BUTLER_API_KEY is not set" }
          Invoke-WebRequest https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler
          ./butler/butler.exe -V
          ./butler/butler.exe push dist/ndml "$($env:ITCH_TARGET):$($env:ITCH_CHANNEL)" --userversion "${{ steps.package.outputs.version }}"
